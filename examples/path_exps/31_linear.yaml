# path_exps | 31_linear
# Path (3) Model: linear baseline (158 coefficients, seconds to train)
# Only changes vs 00_baseline: model -> LinearModel(ols), plus the data processors used by the
#   official Linear benchmark (RobustZScoreNorm + Fillna for features, DropnaLabel + CSRankNorm
#   for label) - linear models are scale-sensitive, trees are not.
# Why: if the linear model is close to LightGBM, the data contains few learnable interactions.
# Anchor: official Alpha158 linear IC 0.0397; a smoke run here measured 0.0392.
# Run: cd examples && PYTHONUTF8=1 MLFLOW_ALLOW_FILE_STORE=true python -m qlib.cli.run path_exps/31_linear.yaml
# Marked lines: the lines ending in '# <<< CHANGED vs baseline' are the actual
# differences; everything else is shared with 00_baseline.yaml.

experiment_name: path_exps

qlib_init:
    provider_uri: "~/.qlib/qlib_data/cn_data"
    region: cn
    kernels: 1

market: &market csi300
benchmark: &benchmark SH000300

data_handler_config: &data_handler_config
    start_time: 2008-01-01
    end_time: 2020-08-01
    fit_start_time: 2008-01-01
    fit_end_time: 2014-12-31
    instruments: *market
    infer_processors:                # <<< CHANGED vs baseline (linear needs scaling)
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:                # <<< CHANGED vs baseline (CSRankNorm instead of CSZScoreNorm)
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
              fields_group: label

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2017-01-01
        end_time: 2020-08-01
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
    model:
        class: LinearModel           # <<< CHANGED vs baseline (was LGBModel)
        module_path: qlib.contrib.model.linear   # <<< CHANGED vs baseline
        kwargs:                      # <<< CHANGED vs baseline (gbm hyper-params removed)
            estimator: ols
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2008-01-01, 2014-12-31]
                valid: [2015-01-01, 2016-12-31]
                test: [2017-01-01, 2020-08-01]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
