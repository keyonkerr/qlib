# path_exps | 23_custom_factors
# Path (2) Features: add 5 hand-written price-volume factors to Alpha158
# Only change vs 00_baseline: handler -> MyAlpha in path_exps/custom_handler.py
# The 5 factors: 20d price-volume corr, 10d coefficient of variation, 20d price rank,
#                10d close-vwap corr, 20d volume trend.
# trusted: true is required by qlib before it will import a .py module_path.
# Why: experience the division of labor - factors are hand-written, the model only combines them.
# Run: cd examples && PYTHONUTF8=1 MLFLOW_ALLOW_FILE_STORE=true python -m qlib.cli.run path_exps/23_custom_factors.yaml
# Marked lines: the lines ending in '# <<< CHANGED vs baseline' are the actual
# differences; everything else is shared with 00_baseline.yaml.

experiment_name: path_exps

qlib_init:
    provider_uri: "~/.qlib/qlib_data/cn_data"
    region: cn
    kernels: 1

market: &market csi300
benchmark: &benchmark SH000300

data_handler_config: &data_handler_config
    start_time: 2008-01-01
    end_time: 2020-08-01
    fit_start_time: 2008-01-01
    fit_end_time: 2014-12-31
    instruments: *market

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2017-01-01
        end_time: 2020-08-01
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 2
            seed: 42
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: MyAlpha              # <<< CHANGED vs baseline (was Alpha158)
                module_path: path_exps/custom_handler.py   # <<< CHANGED vs baseline
                trusted: true               # <<< CHANGED vs baseline (needed for .py module)
                kwargs: *data_handler_config
            segments:
                train: [2008-01-01, 2014-12-31]
                valid: [2015-01-01, 2016-12-31]
                test: [2017-01-01, 2020-08-01]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
