<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实验解剖 · qlib</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="bench">

  <aside class="index">
    <header class="index-head">
      <h1 class="index-title">实验解剖</h1>
      <p class="index-meta" id="meta">读取中</p>
      <input class="index-search" id="q" type="search" placeholder="按配置名或 run id 筛选" aria-label="筛选 run">
    </header>

    <nav class="index-runs" id="runs" aria-label="实验与 run"></nav>

    <div class="pick-bar" id="pickbar" hidden>
      <div class="pick-head">
        <span class="pick-n" id="pickn">已选 0 / 4</span>
        <button class="pick-clear" id="pickclear" type="button">清空</button>
      </div>
      <ol class="pick-slots" id="pickslots"></ol>
      <button class="pick-go" id="pickgo" type="button" disabled>开始对照</button>
    </div>

    <ol class="index-outline" id="outline" aria-label="本页结构"></ol>
  </aside>

  <main class="sheet">
    <p class="loading" id="loading">正在读取 mlruns…</p>
    <article class="specimen" id="specimen" hidden></article>
    <article class="comparison" id="comparison" hidden></article>
  </main>

</div>

<script src="/app.js"></script>
</body>
</html>
